<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Supply Chain{% endblock %} · CMPE341</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ url_for('dashboard') }}">Supply Chain</a>
    {% if g.user %}
    <div class="account"><span>{{ g.user }} · {{ g.role }}</span>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="quiet">Sign out</button></form>
    </div>
    {% endif %}
  </div>
</header>
<main>
{% for msg in get_flashed_messages() %}<p class="notice" role="status">{{ msg }}</p>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
